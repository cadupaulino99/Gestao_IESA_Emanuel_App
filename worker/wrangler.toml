# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Worker "iesa-ai" — backend de IA do Gestão IESA Emanuel
# ─────────────────────────────────────────────────────────────────────────────
# Segredos: GEMINI_API_KEY, FIREBASE_SA_JSON (wrangler secret put)
# R2: criar bucket "iesa-event-posters" no dashboard Cloudflare → R2
# ─────────────────────────────────────────────────────────────────────────────

name = "iesa-ai"
main = "ai-worker.js"
compatibility_date = "2026-01-01"

vars = { PROJECT_ID = "iesa-emanuel-xangongo" }

[observability]
enabled = true
head_sampling_rate = 1

# Bucket R2 para cartazes de eventos
# Cloudflare Dashboard → R2 → Create bucket → nome: iesa-event-posters
[[r2_buckets]]
binding = "POSTERS_BUCKET"
bucket_name = "iesa-event-posters"
