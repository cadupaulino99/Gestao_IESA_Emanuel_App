name: patch-force-r2-binding
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_force_r2_binding.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy-worker-api.mjs worker/ai-worker.js
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(r2): forçar POSTERS_BUCKET no deploy e reportar no health" && git push; fi
