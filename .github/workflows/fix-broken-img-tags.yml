name: fix-broken-img-tags
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_broken_img_tags.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/board/EventFeedPost.tsx src/components/portal/MemberBoard.tsx src/components/admin/EventsAdmin.tsx src/index.css
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix: tags img dos cartazes (decoding async válido)" && git push; fi
