name: patch-finances-readonly
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_finances_readonly.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finances.tsx src/pages/BuildingFund.tsx src/pages/Assets.tsx src/pages/Contributions.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(finances): só leitura para Pastor/Evangelista/Catequista" && git push; fi
