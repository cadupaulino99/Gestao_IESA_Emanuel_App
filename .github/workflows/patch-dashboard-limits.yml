name: patch-dashboard-limits
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_dashboard_limits.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "perf(dashboard): limit membros/eventos e menos leituras" && git push; fi
