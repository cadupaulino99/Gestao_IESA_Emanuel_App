name: restore-member-portal
on:
  workflow_dispatch: {}
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/assemble_member_portal.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MemberPortal.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(portal): UI mockup Geral & Finanças (funções existentes)" && git push; fi
