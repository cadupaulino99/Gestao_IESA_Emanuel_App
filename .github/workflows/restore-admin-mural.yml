name: restore-admin-mural
on:
  workflow_dispatch: {}
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore and modernize admin mural components
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/cadupaulino99/Gestao_IESA_Emanuel_App/b59ed2ae0ffaf64604df034d6689a30d6a482885
          curl -sS -L "$BASE/src/components/admin/AnnouncementsAdmin.tsx" -o src/components/admin/AnnouncementsAdmin.tsx
          curl -sS -L "$BASE/src/components/admin/AgendaAdmin.tsx" -o src/components/admin/AgendaAdmin.tsx
          curl -sS -L "$BASE/src/components/admin/EventsAdmin.tsx" -o src/components/admin/EventsAdmin.tsx
          # Admin.tsx from same base then patch mural
          curl -sS -L "$BASE/src/pages/Admin.tsx" -o src/pages/Admin.tsx
          python3 << 'PY'
          from pathlib import Path

          p = Path('src/components/admin/AnnouncementsAdmin.tsx')
          t = p.read_text()
          t = t.replace(
              '''  return (\n    <Card>\n      <CardHeader className="pb-3">\n        <CardTitle className="flex items-center gap-2 text-base"><Bell className="h-4 w-4" /> Avisos</CardTitle>\n        <CardDescription>\n          Fonte única: o que publicar aqui aparece no Portal do Membro → «Avisos, Agenda e Eventos».\n          Rascunhos e expirados só a liderança vê.\n        </CardDescription>\n      </CardHeader>\n      <CardContent className="space-y-4">\n        {/* ── formulário ── */}\n        <div className="space-y-3 rounded-lg border bg-slate-50 dark:bg-slate-900 p-3">''',
              '''  return (\n    <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n      <CardHeader className="space-y-1 border-b bg-muted/20 pb-4">\n        <CardTitle className="flex items-center gap-2 text-base font-semibold tracking-tight">\n          <span className="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-500/15 text-amber-700 dark:text-amber-300">\n            <Bell className="h-4 w-4" />\n          </span>\n          Avisos\n        </CardTitle>\n        <CardDescription>\n          Fonte única: o que publicar aqui aparece no Portal do Membro → «Avisos, Agenda e Eventos».\n          Rascunhos e expirados só a liderança vê.\n        </CardDescription>\n      </CardHeader>\n      <CardContent className="space-y-4 pt-4">\n        {/* ── formulário ── */}\n        <div className="space-y-3 rounded-xl border bg-muted/30 p-3 sm:p-4">''',
              1,
          )
          t = t.replace('    <div className="rounded-lg border p-3 space-y-1.5">', '    <div className="space-y-1.5 rounded-xl border bg-card p-3 shadow-sm">')
          p.write_text(t)
          assert 'bg-amber-500/15' in t and 'PLACEHOLDER' not in t

          p = Path('src/components/admin/AgendaAdmin.tsx')
          t = p.read_text()
          t = t.replace(
              '''  return (\n    <Card>\n      <CardHeader className="pb-3">\n        <CardTitle className="flex items-center gap-2 text-base"><CalendarDays className="h-4 w-4" /> Agenda semanal</CardTitle>\n        <CardDescription>''',
              '''  return (\n    <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n      <CardHeader className="space-y-1 border-b bg-muted/20 pb-4">\n        <CardTitle className="flex items-center gap-2 text-base font-semibold tracking-tight">\n          <span className="flex h-8 w-8 items-center justify-center rounded-lg bg-sky-500/15 text-sky-700 dark:text-sky-300">\n            <CalendarDays className="h-4 w-4" />\n          </span>\n          Agenda semanal\n        </CardTitle>\n        <CardDescription>''',
              1,
          )
          idx = t.find('<CardContent className="space-y-4">')
          if idx != -1:
              t = t[:idx] + '<CardContent className="space-y-4 pt-4">' + t[idx+len('<CardContent className="space-y-4">'):]
          t = t.replace('rounded-lg border bg-slate-50 dark:bg-slate-900 p-3', 'rounded-xl border bg-muted/30 p-3 sm:p-4', 1)
          p.write_text(t)
          assert 'bg-sky-500/15' in t

          p = Path('src/components/admin/EventsAdmin.tsx')
          t = p.read_text()
          t = t.replace(
              '''  return (\n    <Card>\n      <CardHeader className="pb-3">\n        <CardTitle className="flex items-center gap-2 text-base"><CalendarPlus className="h-4 w-4" /> Eventos</CardTitle>\n        <CardDescription>''',
              '''  return (\n    <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n      <CardHeader className="space-y-1 border-b bg-muted/20 pb-4">\n        <CardTitle className="flex items-center gap-2 text-base font-semibold tracking-tight">\n          <span className="flex h-8 w-8 items-center justify-center rounded-lg bg-violet-500/15 text-violet-700 dark:text-violet-300">\n            <CalendarPlus className="h-4 w-4" />\n          </span>\n          Eventos\n        </CardTitle>\n        <CardDescription>''',
              1,
          )
          idx = t.find('<CardContent className="space-y-4">')
          if idx != -1:
              t = t[:idx] + '<CardContent className="space-y-4 pt-4">' + t[idx+len('<CardContent className="space-y-4">'):]
          t = t.replace('rounded-lg border bg-slate-50 dark:bg-slate-900 p-3', 'rounded-xl border bg-muted/30 p-3 sm:p-4', 1)
          p.write_text(t)
          assert 'bg-violet-500/15' in t

          p = Path('src/pages/Admin.tsx')
          t = p.read_text()
          old = '''        <TabsContent value="mural" className="space-y-6">\n          {/* v1.13.0 — «Avisos, Agenda e Eventos»: gestão pela liderança, leitura\n              pelos membros no Portal (mesmas colecções — fonte única). */}\n          <AnnouncementsAdmin />\n          <AgendaAdmin />\n          <EventsAdmin />\n        </TabsContent>'''
          new = '''        <TabsContent value="mural" className="space-y-5">\n          {/* v1.13.0 — «Avisos, Agenda e Eventos»: gestão pela liderança, leitura\n              pelos membros no Portal (mesmas colecções — fonte única). */}\n          <div className="relative overflow-hidden rounded-2xl border bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 px-4 py-5 text-white shadow-sm sm:px-6">\n            <div className="pointer-events-none absolute -right-10 -top-12 h-40 w-40 rounded-full bg-white/10 blur-2xl" />\n            <div className="relative">\n              <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-300">Comunicação</p>\n              <h3 className="mt-1 text-xl font-bold tracking-tight sm:text-2xl">Avisos, Agenda e Eventos</h3>\n              <p className="mt-1 max-w-2xl text-sm text-slate-300">\n                Gestão da liderança · o que publicar aqui aparece no Portal do Membro (fonte única de dados).\n              </p>\n            </div>\n          </div>\n          <AnnouncementsAdmin />\n          <AgendaAdmin />\n          <EventsAdmin />\n        </TabsContent>'''
          if old not in t:
              raise SystemExit('Admin mural block not found')
          t = t.replace(old, new, 1)
          t = t.replace(
              '<TabsList className="mb-4 flex-wrap">',
              '<TabsList className="mb-4 flex h-auto w-full flex-wrap gap-1 rounded-xl border bg-white p-1 shadow-sm dark:bg-card">',
              1,
          )
          p.write_text(t)
          assert 'Comunicação' in t
          print('all ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AnnouncementsAdmin.tsx src/components/admin/AgendaAdmin.tsx src/components/admin/EventsAdmin.tsx src/pages/Admin.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "ui(admin): modernizar mural Avisos, Agenda e Eventos" && git push; fi
