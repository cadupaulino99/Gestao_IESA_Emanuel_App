name: cleanup-legacy-workflows
on:
  workflow_dispatch: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remover workflows pontuais (patch/restore/bump/fix/apply)
        run: |
          set -e
          KEEP="ci.yml build-android.yml deploy-ai-worker.yml deploy-firebase.yml deploy-hosting.yml worker-health.yml cleanup-legacy-workflows.yml"
          cd .github/workflows
          for f in *.yml *.yaml; do
            [ -f "$f" ] || continue
            skip=0
            for k in $KEEP; do
              if [ "$f" = "$k" ]; then skip=1; break; fi
            done
            if [ "$skip" -eq 0 ]; then
              echo "DELETE $f"
              rm -f "$f"
            else
              echo "KEEP $f"
            fi
          done
          cd ../..
          # scripts de patch pontuais (opcional — só scripts/patch_* e bump_*)
          if [ -d scripts ]; then
            find scripts -maxdepth 1 -type f \( -name 'patch_*.py' -o -name 'bump_*.py' -o -name 'fix_*.py' \) -print -delete || true
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada a limpar"
          else
            git commit -m "chore: remover workflows legados (disciplina de release)"
            git push
          fi
