name: patch-card-and-poster
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_card_and_poster.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/posters.ts src/pages/MemberPortal.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix: cartão portal = admin; upload R2 sem falso Cloudflare" && git push; fi
