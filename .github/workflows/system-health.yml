name: system-health

# Monitorização + métricas de saúde em produção.
# Verifica Worker, R2, cron, secrets, Hosting; grava métricas em artifact e summary.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Verificar produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://iesa-ai.cadupaulino99.workers.dev
      HOSTING_URL: https://iesa-emanuel-xangongo.web.app
      HOSTING_URL_ALT: https://iesa-emanuel-xangongo.firebaseapp.com
    steps:
      - uses: actions/checkout@v4

      - name: Recolher métricas (Worker + Hosting)
        id: metrics
        run: |
          set +e
          mkdir -p /tmp/metrics
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # --- Worker /__health + latência ---
          START=$(date +%s%3N)
          HTTP_W=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 20 "$WORKER_URL/__health")
          END=$(date +%s%3N)
          LAT_W=$((END - START))

          # --- Hosting latência ---
          START=$(date +%s%3N)
          HTTP_H1=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$HOSTING_URL/")
          END=$(date +%s%3N)
          LAT_H1=$((END - START))

          START=$(date +%s%3N)
          HTTP_H2=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$HOSTING_URL_ALT/")
          END=$(date +%s%3N)
          LAT_H2=$((END - START))

          EXP_VER="$(grep -o "WORKER_VERSION = '[^']*'" worker/ai-worker.js 2>/dev/null | head -1 | cut -d"'" -f2 || true)"

          node <<NODE
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          const ts = process.env.TS;
          const httpW = process.env.HTTP_W;
          const latW = Number(process.env.LAT_W);
          const httpH1 = process.env.HTTP_H1;
          const latH1 = Number(process.env.LAT_H1);
          const httpH2 = process.env.HTTP_H2;
          const latH2 = Number(process.env.LAT_H2);
          const expVer = process.env.EXP_VER || '';

          const problems = [];
          let j = {};
          try { j = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8')); } catch (e) {
            problems.push('health_json_invalid');
          }

          if (httpW !== '200') problems.push('worker_http_' + httpW);
          if (j.ok !== true) problems.push('worker_ok_false');
          if (!j.version) problems.push('worker_no_version');
          if (j.vision !== true) problems.push('vision_false');

          const cfg = j.config || {};
          if (!cfg.GEMINI_API_KEY) problems.push('missing_GEMINI_API_KEY');
          if (!cfg.FIREBASE_SA_JSON) problems.push('missing_FIREBASE_SA_JSON');
          if (!cfg.PROJECT_ID) problems.push('missing_PROJECT_ID');

          const r2 = j.r2 || {};
          if (r2.bound !== true) problems.push('r2_not_bound');

          const cron = j.cron || {};
          if (cron.ok === false) problems.push('cron_not_ok');
          const cronAge = typeof cron.ageMinutes === 'number' ? cron.ageMinutes : null;
          if (cronAge != null && cronAge > 180) problems.push('cron_stale_' + cronAge + 'm');

          const liveVer = j.version || '';
          const drift = !!(expVer && liveVer && expVer !== liveVer);
          if (drift) problems.push('version_drift');

          const hostingOk = httpH1 === '200' || httpH2 === '200';
          if (!hostingOk) problems.push('hosting_down');

          // Limiares de latência (aviso, não falha dura salvo valores extremos)
          if (latW > 5000) problems.push('worker_latency_high');
          if (Math.min(latH1, latH2) > 8000) problems.push('hosting_latency_high');

          const healthy = problems.length === 0;

          const metrics = {
            timestamp: ts,
            healthy,
            problems,
            worker: {
              http: Number(httpW) || httpW,
              latencyMs: latW,
              ok: j.ok === true,
              version: liveVer,
              versionRepo: expVer,
              drift,
              vision: j.vision === true,
              service: j.service || null,
              build: j.build || null,
              config: {
                GEMINI_API_KEY: !!cfg.GEMINI_API_KEY,
                FIREBASE_SA_JSON: !!cfg.FIREBASE_SA_JSON,
                PROJECT_ID: cfg.PROJECT_ID || null,
                POSTERS_BUCKET: !!cfg.POSTERS_BUCKET,
              },
              r2: {
                bound: r2.bound === true,
                binding: r2.binding || null,
                bucket: r2.bucket || null,
              },
              cron: {
                ok: cron.ok !== false,
                ageMinutes: cronAge,
                version: cron.version || null,
                counts: cron.counts || null,
                error: cron.error || null,
              },
              rateLimit: j.rateLimit || null,
            },
            hosting: {
              webapp: { http: Number(httpH1) || httpH1, latencyMs: latH1 },
              firebaseapp: { http: Number(httpH2) || httpH2, latencyMs: latH2 },
              ok: hostingOk,
            },
          };

          fs.writeFileSync('/tmp/metrics/health-metrics.json', JSON.stringify(metrics, null, 2));
          fs.appendFileSync(out, 'healthy=' + healthy + '\n');
          fs.appendFileSync(out, 'problems=' + problems.join(',') + '\n');
          fs.appendFileSync(out, 'worker_version=' + liveVer + '\n');
          fs.appendFileSync(out, 'worker_latency_ms=' + latW + '\n');
          fs.appendFileSync(out, 'hosting_latency_ms=' + Math.min(latH1, latH2) + '\n');
          fs.appendFileSync(out, 'cron_age_min=' + (cronAge ?? '') + '\n');
          fs.appendFileSync(out, 'r2_bound=' + (r2.bound === true) + '\n');
          fs.appendFileSync(out, 'drift=' + drift + '\n');

          console.log(JSON.stringify(metrics, null, 2));
          NODE
          TS="$TS" HTTP_W="$HTTP_W" LAT_W="$LAT_W" HTTP_H1="$HTTP_H1" LAT_H1="$LAT_H1" \
          HTTP_H2="$HTTP_H2" LAT_H2="$LAT_H2" EXP_VER="$EXP_VER" \
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          const ts = process.env.TS;
          const httpW = process.env.HTTP_W;
          const latW = Number(process.env.LAT_W);
          const httpH1 = process.env.HTTP_H1;
          const latH1 = Number(process.env.LAT_H1);
          const httpH2 = process.env.HTTP_H2;
          const latH2 = Number(process.env.LAT_H2);
          const expVer = process.env.EXP_VER || '';

          const problems = [];
          let j = {};
          try { j = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8')); } catch (e) {
            problems.push('health_json_invalid');
          }

          if (httpW !== '200') problems.push('worker_http_' + httpW);
          if (j.ok !== true) problems.push('worker_ok_false');
          if (!j.version) problems.push('worker_no_version');
          if (j.vision !== true) problems.push('vision_false');

          const cfg = j.config || {};
          if (!cfg.GEMINI_API_KEY) problems.push('missing_GEMINI_API_KEY');
          if (!cfg.FIREBASE_SA_JSON) problems.push('missing_FIREBASE_SA_JSON');
          if (!cfg.PROJECT_ID) problems.push('missing_PROJECT_ID');

          const r2 = j.r2 || {};
          if (r2.bound !== true) problems.push('r2_not_bound');

          const cron = j.cron || {};
          if (cron.ok === false) problems.push('cron_not_ok');
          const cronAge = typeof cron.ageMinutes === 'number' ? cron.ageMinutes : null;
          if (cronAge != null && cronAge > 180) problems.push('cron_stale_' + cronAge + 'm');

          const liveVer = j.version || '';
          const drift = !!(expVer && liveVer && expVer !== liveVer);
          if (drift) problems.push('version_drift');

          const hostingOk = httpH1 === '200' || httpH2 === '200';
          if (!hostingOk) problems.push('hosting_down');

          if (latW > 5000) problems.push('worker_latency_high');
          if (Math.min(latH1, latH2) > 8000) problems.push('hosting_latency_high');

          const healthy = problems.length === 0;

          const metrics = {
            timestamp: ts,
            healthy,
            problems,
            worker: {
              http: Number(httpW) || httpW,
              latencyMs: latW,
              ok: j.ok === true,
              version: liveVer,
              versionRepo: expVer,
              drift,
              vision: j.vision === true,
              service: j.service || null,
              build: j.build || null,
              config: {
                GEMINI_API_KEY: !!cfg.GEMINI_API_KEY,
                FIREBASE_SA_JSON: !!cfg.FIREBASE_SA_JSON,
                PROJECT_ID: cfg.PROJECT_ID || null,
                POSTERS_BUCKET: !!cfg.POSTERS_BUCKET,
              },
              r2: {
                bound: r2.bound === true,
                binding: r2.binding || null,
                bucket: r2.bucket || null,
              },
              cron: {
                ok: cron.ok !== false,
                ageMinutes: cronAge,
                version: cron.version || null,
                counts: cron.counts || null,
                error: cron.error || null,
              },
              rateLimit: j.rateLimit || null,
            },
            hosting: {
              webapp: { http: Number(httpH1) || httpH1, latencyMs: latH1 },
              firebaseapp: { http: Number(httpH2) || httpH2, latencyMs: latH2 },
              ok: hostingOk,
            },
          };

          fs.writeFileSync('/tmp/metrics/health-metrics.json', JSON.stringify(metrics, null, 2));
          fs.appendFileSync(out, 'healthy=' + healthy + '\n');
          fs.appendFileSync(out, 'problems=' + problems.join(',') + '\n');
          fs.appendFileSync(out, 'worker_version=' + liveVer + '\n');
          fs.appendFileSync(out, 'worker_latency_ms=' + latW + '\n');
          fs.appendFileSync(out, 'hosting_latency_ms=' + Math.min(latH1, latH2) + '\n');
          fs.appendFileSync(out, 'cron_age_min=' + (cronAge ?? '') + '\n');
          fs.appendFileSync(out, 'r2_bound=' + (r2.bound === true) + '\n');
          fs.appendFileSync(out, 'drift=' + drift + '\n');
          console.log(JSON.stringify({ healthy, problems, workerLatencyMs: latW, hostingLatencyMs: Math.min(latH1, latH2), cronAge }, null, 2));
          NODE

      - name: Summary das métricas
        run: |
          {
            echo "## Métricas de saúde"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---------|-------|"
            echo "| Saudável | ${{ steps.metrics.outputs.healthy }} |"
            echo "| Worker versão | ${{ steps.metrics.outputs.worker_version }} |"
            echo "| Worker latência (ms) | ${{ steps.metrics.outputs.worker_latency_ms }} |"
            echo "| Hosting latência (ms) | ${{ steps.metrics.outputs.hosting_latency_ms }} |"
            echo "| R2 bound | ${{ steps.metrics.outputs.r2_bound }} |"
            echo "| Cron age (min) | ${{ steps.metrics.outputs.cron_age_min }} |"
            echo "| Drift versão | ${{ steps.metrics.outputs.drift }} |"
            echo "| Problemas | ${{ steps.metrics.outputs.problems }} |"
            echo ""
            echo "Artifact: \\'health-metrics.json\\' (download no run)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact métricas
        uses: actions/upload-artifact@v4
        with:
          name: health-metrics
          path: /tmp/metrics/health-metrics.json
          retention-days: 30

      - name: Abrir issue se unhealthy
        if: steps.metrics.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title Saúde do sistema" --json number -q 'length')"
          if [ "$EXISTE" != "0" ]; then echo "Já existe issue aberta de saúde; não duplico."; exit 0; fi
          TITLE="Saúde do sistema: problema detectado"
          BODY="Monitor (system-health) reportou problemas: **${{ steps.metrics.outputs.problems }}**

          - Worker v=${{ steps.metrics.outputs.worker_version }} latency=${{ steps.metrics.outputs.worker_latency_ms }}ms
          - Hosting latency=${{ steps.metrics.outputs.hosting_latency_ms }}ms
          - R2 bound=${{ steps.metrics.outputs.r2_bound }} cronAge=${{ steps.metrics.outputs.cron_age_min }}min
          - Drift=${{ steps.metrics.outputs.drift }}

          Ver run e artifact health-metrics.json. docs/MONITORIZACAO.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"

      - name: Falhar o job se unhealthy
        if: steps.metrics.outputs.healthy != 'true'
        run: |
          echo "::error::Problemas: ${{ steps.metrics.outputs.problems }}"
          exit 1
