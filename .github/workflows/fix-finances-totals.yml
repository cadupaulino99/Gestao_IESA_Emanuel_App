name: fix-finances-totals
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix totals
        run: python3 scripts/fix_finances_totals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finances.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(financas): definir totalDespesas, saldoAtual e atalhos" && git push; fi
