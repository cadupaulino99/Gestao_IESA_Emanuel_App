name: Deploy Firebase Hosting (web)

# Publica a app web em https://iesa-emanuel-xangongo.web.app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'apk/**'
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Build + Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web
        env:
          # Opcional: App Check (reCAPTCHA v3). Sem secret = build igual ao anterior.
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
        run: |
          if [ -n "$VITE_FIREBASE_APPCHECK_SITE_KEY" ]; then
            echo "App Check site key presente no build (Hosting)."
          else
            echo "Sem VITE_FIREBASE_APPCHECK_SITE_KEY — App Check fica inactivo neste build."
          fi
          npm run build

      - name: Autenticar Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT em falta"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          npx firebase-tools@latest use iesa-emanuel-xangongo --token "$(node -e "const j=require('/tmp/sa.json'); process.stdout.write('')")" 2>/dev/null || true

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: iesa-emanuel-xangongo
