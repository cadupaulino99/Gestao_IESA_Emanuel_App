name: patch-r2-posters
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_worker_r2_posters.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/ai-worker.js worker/wrangler.toml src/types.ts src/lib/board.ts src/lib/posters.ts src/components/board/EventFeedPost.tsx src/components/admin/EventsAdmin.tsx firestore.rules
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(r2): cartazes via Worker + Cloudflare R2" && git push; fi
