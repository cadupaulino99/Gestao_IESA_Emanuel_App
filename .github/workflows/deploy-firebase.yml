name: Deploy Firebase (regras, índices e funções)

# Dispara manualmente (GitHub > Actions > "Deploy Firebase" > Run workflow)
# depois de configures os secrets (ver docs/GUIA-FIREBASE.md, passo 9):
#   FIREBASE_SERVICE_ACCOUNT  (JSON da conta de serviço)
#   FIREBASE_PROJECT_ID       (id do projeto)
on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: firebase deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Autenticar com a conta de serviço
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy Firestore (regras + índices) — obrigatório
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # v1.17: um só backend de IA — a pasta functions/ foi removida (morta
        # no plano Spark); toda a IA vive no Cloudflare Worker (worker/).
        # v1.13.1: separado do Storage — as regras/índices NAO dependem do
        # bucket e nao podem ficar refens dele (o deploy conjunto abortava
        # tudo quando o Storage ainda nao estava ativado no console).
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" 2>&1 | tee /tmp/deploy.log

      - name: Deploy Storage (regras dos cartazes) — tolerante
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # Falha SEM vergonha enquanto o bucket nao existir: ativa em
        # https://console.firebase.google.com/project/iesa-emanuel-xangongo/storage
        # (botao «Começar») e volta a correr este workflow — os cartazes dos
        # eventos passam a funcionar; o resto do modulo nao depende disto.
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only storage --project "$PROJECT_ID" 2>&1 | tee -a /tmp/deploy.log \
            || echo "::warning::Storage NAO publicado — ativa o bucket no console (Storage → Começar) e volta a correr o workflow. Regras/índices do Firestore JA foram publicados acima."

      - name: Reportar falha em issue (com o log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sem dedup: uma issue por falha, com o run no título
          {
            echo 'Ultimas 60 linhas do deploy:'
            echo ''
            echo '```'
            tail -60 /tmp/deploy.log || echo '(sem log)'
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Deploy Firebase falhou run ${{ github.run_id }}" --body-file /tmp/body.md || true
