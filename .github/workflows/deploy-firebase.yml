name: Deploy Firebase (regras, índices e funções)

# Dispara manualmente (GitHub > Actions > "Deploy Firebase" > Run workflow)
# depois de configures os secrets (ver docs/GUIA-FIREBASE.md, passo 9):
#   FIREBASE_SERVICE_ACCOUNT  (JSON da conta de serviço)
#   FIREBASE_PROJECT_ID       (id do projeto)
on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: firebase deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências das funções
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Autenticar com a conta de serviço
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy (regras + índices + funções)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # Plano Spark (gratuito) nao permite Cloud Functions (exige Blaze).
        # Regras + indices implantam-se normalmente. Quando ativares o Blaze,
        # acrescenta ",functions" ao --only para levar tambem a IA.
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" 2>&1 | tee /tmp/deploy.log

      - name: Reportar falha em issue (com o log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTE="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Deploy Firebase falhou" --json number -q 'length')"
          if [ "$EXISTE" != "0" ]; then echo "ja ha issue de falha aberta"; exit 0; fi
          BODY="$(tail -60 /tmp/deploy.log | sed 's/`/\`/g')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Deploy Firebase falhou (log anexado)" --body "Ultimas 60 linhas do deploy:

\`\`\`
$BODY
\`\`\`" || true
