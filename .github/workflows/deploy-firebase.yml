name: Deploy Firebase (regras, índices e funções)

# Dispara manualmente (GitHub > Actions > "Deploy Firebase" > Run workflow)
# depois de configures os secrets (ver docs/GUIA-FIREBASE.md, passo 9):
#   FIREBASE_SERVICE_ACCOUNT  (JSON da conta de serviço)
#   FIREBASE_PROJECT_ID       (id do projeto)
on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: firebase deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências das funções
        run: npm --prefix functions ci || npm --prefix functions install

      - name: Autenticar com a conta de serviço
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

      - name: Deploy (regras + índices + funções)
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        # Plano Spark (gratuito) nao permite Cloud Functions (exige Blaze).
        # Regras + indices implantam-se normalmente. Quando ativares o Blaze,
        # acrescenta ",functions" ao --only para levar tambem a IA.
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" 2>&1 | tee /tmp/deploy.log

      - name: Reportar falha em issue (com o log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # sem dedup: uma issue por falha, com o run no título
          {
            echo 'Ultimas 60 linhas do deploy:'
            echo ''
            echo '```'
            tail -60 /tmp/deploy.log || echo '(sem log)'
            echo '```'
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Deploy Firebase falhou run ${{ github.run_id }}" --body-file /tmp/body.md || true
