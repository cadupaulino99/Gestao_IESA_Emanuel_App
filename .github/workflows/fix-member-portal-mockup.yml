name: fix-member-portal-mockup
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Restore last good MemberPortal then restyle
        run: |
          set -e
          # última versão boa antes do PLACEHOLDER
          git show f5f33389a1166a80b584388913b1152a09e5e2a5:src/pages/MemberPortal.tsx > src/pages/MemberPortal.tsx
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/MemberPortal.tsx')
          t = p.read_text()
          # ícones + chart
          t = t.replace(
          '''  LogOut,
  CreditCard,
  Download,
  FileText,
  Settings2,
  Pencil,
  UserRound,
  HeartHandshake,
} from "lucide-react";''',
          '''  LogOut,
  CreditCard,
  FileText,
  Settings2,
  Pencil,
  UserRound,
  Home,
  CalendarDays,
  Radio,
  Handshake,
  ChevronRight,
  Users,
  CheckCircle2,
  TrendingUp,
  RefreshCw,
} from "lucide-react";''')
          t = t.replace(
          '''import {
  BarChart,
  Bar,
  XAxis,
  YAxis,
  Tooltip,
  ResponsiveContainer,
} from "recharts";''',
          '''import {
  XAxis,
  YAxis,
  Tooltip,
  ResponsiveContainer,
  CartesianGrid,
  Area,
  AreaChart,
} from "recharts";''')
          # Header visual
          t = t.replace(
          '''    <div className="min-h-screen bg-slate-50 dark:bg-background p-3 sm:p-4 md:p-8">
      <div className="mx-auto max-w-5xl space-y-5">
        <UpdateBanner />
        <header className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-sky-700 via-blue-700 to-indigo-800 p-4 text-white shadow-md sm:p-5">
          <div className="pointer-events-none absolute -right-10 -top-12 h-40 w-40 rounded-full bg-white/10 blur-2xl" />
          <div className="relative flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div className="flex items-start gap-3">
              <span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white/15">
                <HeartHandshake className="h-6 w-6" />
              </span>
              <div>
                <p className="text-[11px] font-semibold uppercase tracking-[0.14em] text-sky-100/90">Área do membro</p>
                <h1 className="text-xl font-bold tracking-tight sm:text-2xl">Portal do Membro</h1>
                <p className="mt-0.5 text-sm text-sky-100/90">
                  Bem-vindo(a), <span className="font-semibold text-white">{memberData.name}</span>
                </p>
              </div>
            </div>
            <Button
              variant="secondary"
              onClick={signOut}
              className="w-full gap-2 rounded-xl border-0 bg-white/15 text-white hover:bg-white/25 sm:w-auto"
            >
              <LogOut className="h-4 w-4" />
              Sair
            </Button>
          </div>
        </header>

        <Tabs defaultValue="dados" className="w-full">
          <TabsList className="flex h-auto w-full flex-wrap gap-1 rounded-xl border bg-white p-1 shadow-sm dark:bg-card">
            <TabsTrigger value="dados" className="rounded-lg text-xs sm:text-sm">Geral & Finanças</TabsTrigger>
            <TabsTrigger value="mural" className="rounded-lg text-xs sm:text-sm">Avisos & Eventos</TabsTrigger>
            <TabsTrigger value="radio" className="rounded-lg text-xs sm:text-sm">Rádio</TabsTrigger>
            <TabsTrigger value="suporte" className="rounded-lg text-xs sm:text-sm">Suporte</TabsTrigger>
            <TabsTrigger value="cartao" className="gap-1.5 rounded-lg text-xs sm:text-sm">
              <CreditCard className="h-3.5 w-3.5" /> Cartão
            </TabsTrigger>
          </TabsList>''',
          '''    <div className="min-h-screen bg-gradient-to-b from-slate-100 via-slate-50 to-white dark:from-slate-950 dark:via-slate-950 dark:to-background">
      <div className="mx-auto max-w-6xl space-y-4 p-3 sm:p-5 md:p-6">
        <UpdateBanner />
        <header className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-[#0b3d91] via-[#1557c0] to-[#1a6fe0] text-white shadow-lg">
          <div className="pointer-events-none absolute inset-0 opacity-30" style={{ backgroundImage: 'radial-gradient(circle at 80% 40%, rgba(255,255,255,0.25), transparent 55%)' }} />
          <div className="relative flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
            <div className="flex items-center gap-3 sm:gap-4">
              <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-full border-2 border-white/40 bg-white/10 sm:h-16 sm:w-16">
                <div className="text-center leading-tight">
                  <span className="block text-[10px] font-black tracking-wide text-amber-300">IESA</span>
                  <span className="block text-[8px] font-semibold text-white/90">EMANUEL</span>
                  <span className="block text-[7px] text-white/70">XANGONGO</span>
                </div>
              </div>
              <div>
                <p className="text-sm font-bold text-amber-300 sm:text-base">Área do Membro</p>
                <h1 className="text-2xl font-black tracking-tight sm:text-3xl">Portal do Membro</h1>
                <p className="mt-0.5 text-sm text-blue-100">
                  Bem-vindo(a), <span className="font-semibold text-white">{memberData.name}</span>
                </p>
              </div>
            </div>
            <Button onClick={signOut} className="w-full gap-2 rounded-xl border border-white/30 bg-white/15 text-white hover:bg-white/25 sm:w-auto">
              <LogOut className="h-4 w-4" />
              Sair
            </Button>
          </div>
        </header>

        <Tabs defaultValue="dados" className="w-full">
          <TabsList className="mx-auto flex h-auto w-full max-w-3xl flex-wrap justify-center gap-1 rounded-2xl border border-slate-200/80 bg-white p-1.5 shadow-sm dark:bg-card">
            <TabsTrigger value="dados" className="gap-1.5 rounded-xl px-3 py-2 text-xs data-[state=active]:bg-[#1557c0] data-[state=active]:text-white sm:text-sm">
              <Home className="h-3.5 w-3.5" /> Geral & Finanças
            </TabsTrigger>
            <TabsTrigger value="mural" className="gap-1.5 rounded-xl px-3 py-2 text-xs sm:text-sm">
              <CalendarDays className="h-3.5 w-3.5" /> Avisos & Eventos
            </TabsTrigger>
            <TabsTrigger value="radio" className="gap-1.5 rounded-xl px-3 py-2 text-xs sm:text-sm">
              <Radio className="h-3.5 w-3.5" /> Rádio
            </TabsTrigger>
            <TabsTrigger value="suporte" className="gap-1.5 rounded-xl px-3 py-2 text-xs sm:text-sm">
              <Handshake className="h-3.5 w-3.5" /> Suporte
            </TabsTrigger>
            <TabsTrigger value="cartao" className="gap-1.5 rounded-xl px-3 py-2 text-xs sm:text-sm">
              <CreditCard className="h-3.5 w-3.5" /> Cartão
            </TabsTrigger>
          </TabsList>''')
          # Meus Dados card header
          t = t.replace(
          '''          <TabsContent value="dados" className="space-y-6 pt-4">
            <div className="grid md:grid-cols-3 gap-6">
              <Card className="rounded-2xl border-border/70 shadow-sm md:col-span-1">
                <CardHeader className="flex-row items-center justify-between space-y-0">
                  <CardTitle className="text-base font-semibold tracking-tight">Meus Dados</CardTitle>
                  <Button variant="ghost" size="sm" onClick={openEdit} className="gap-1.5">
                    <Pencil className="h-3.5 w-3.5" /> Editar
                  </Button>
                </CardHeader>
                <CardContent className="space-y-4">
                  <div>
                    <span className="text-muted-foreground block text-sm">Estado</span>
                    <Badge variant={memberData.status === "Activo" ? "default" : "secondary"}>
                      {memberData.status || "Activo"}
                    </Badge>
                  </div>
                  <div>
                    <span className="text-muted-foreground block text-sm">Célula / Grupo</span>
                    <span className="font-medium">{memberData.groupCell || "-"}</span>
                  </div>
                  <div>
                    <span className="text-muted-foreground block text-sm">Data de Baptismo</span>
                    <span className="font-medium">
                      {memberData.baptismDate
                        ? new Date(memberData.baptismDate).toLocaleDateString("pt-AO")
                        : "-"}
                    </span>
                  </div>
                  <div className="pt-4 space-y-2">
                    <Button className="w-full justify-start" variant="outline" onClick={() => generateMembershipCard(memberData)}>
                      <CreditCard className="h-4 w-4 mr-2 text-emerald-600" /> Baixar Cartão
                    </Button>
                    <Button className="w-full justify-start" variant="outline" onClick={handleGenerateExtract} disabled={tithes.length === 0}>
                      <FileText className="h-4 w-4 mr-2 text-blue-600" /> Extrato Anual
                    </Button>''',
          '''          <TabsContent value="dados" className="mt-4 space-y-4">
            <div className="grid gap-4 lg:grid-cols-5">
              <Card className="overflow-hidden rounded-2xl border-0 shadow-md lg:col-span-2">
                <div className="flex items-center justify-between bg-gradient-to-r from-[#0b3d91] to-[#1557c0] px-4 py-3 text-white">
                  <div className="flex items-center gap-2">
                    <UserRound className="h-5 w-5" />
                    <h2 className="text-base font-bold">Meus Dados</h2>
                  </div>
                  <Button size="sm" variant="secondary" onClick={openEdit} className="h-8 gap-1 rounded-full border-0 bg-white/20 text-white hover:bg-white/30">
                    <Pencil className="h-3.5 w-3.5" /> Editar
                  </Button>
                </div>
                <CardContent className="space-y-4 bg-white p-4 dark:bg-card">
                  <div className="flex items-start gap-3">
                    <div className="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-blue-50 text-[#1557c0] ring-2 ring-blue-100">
                      <UserRound className="h-8 w-8" />
                    </div>
                    <div className="min-w-0 space-y-2 text-sm">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-muted-foreground">Estado:</span>
                        <Badge className={String(memberData.status || 'Activo').toLowerCase().startsWith('activ') || String(memberData.status || 'Activo').toLowerCase().startsWith('ativ') ? 'bg-emerald-600 hover:bg-emerald-600' : ''} variant={String(memberData.status || 'Activo').toLowerCase().startsWith('activ') || String(memberData.status || 'Activo').toLowerCase().startsWith('ativ') ? 'default' : 'secondary'}>
                          <CheckCircle2 className="mr-1 h-3 w-3" />
                          {memberData.status || 'Activo'}
                        </Badge>
                      </div>
                      <div className="flex items-start gap-2">
                        <Users className="mt-0.5 h-4 w-4 shrink-0 text-[#1557c0]" />
                        <div>
                          <p className="text-xs text-muted-foreground">Célula / Grupo</p>
                          <p className="font-semibold">{memberData.groupCell || '—'}</p>
                        </div>
                      </div>
                      <div className="flex items-start gap-2">
                        <CalendarDays className="mt-0.5 h-4 w-4 shrink-0 text-[#1557c0]" />
                        <div>
                          <p className="text-xs text-muted-foreground">Data de Baptismo</p>
                          <p className="font-semibold">{memberData.baptismDate ? new Date(memberData.baptismDate).toLocaleDateString('pt-AO') : '—'}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="space-y-2 pt-1">
                    <Button className="w-full justify-between rounded-xl border-blue-100 bg-blue-50/80 text-[#0b3d91] hover:bg-blue-100" variant="outline" onClick={() => generateMembershipCard(memberData)}>
                      <span className="flex items-center gap-2"><CreditCard className="h-4 w-4" /> Baixar Cartão</span>
                      <ChevronRight className="h-4 w-4 opacity-60" />
                    </Button>
                    <Button className="w-full justify-between rounded-xl border-violet-100 bg-violet-50/80 text-violet-900 hover:bg-violet-100" variant="outline" onClick={handleGenerateExtract} disabled={tithes.length === 0}>
                      <span className="flex items-center gap-2"><FileText className="h-4 w-4" /> Extrato Anual</span>
                      <ChevronRight className="h-4 w-4 opacity-60" />
                    </Button>''')
          # Pedir atualização button style
          t = t.replace(
          '''                        <Button className="w-full justify-start" variant="outline">
                          <Settings2 className="h-4 w-4 mr-2 text-muted-foreground" /> Pedir Atualização de Dados
                        </Button>''',
          '''                        <Button className="w-full justify-between rounded-xl border-emerald-100 bg-emerald-50/80 text-emerald-900 hover:bg-emerald-100" variant="outline">
                          <span className="flex items-center gap-2"><RefreshCw className="h-4 w-4" /> Pedir Actualização de Dados</span>
                          <ChevronRight className="h-4 w-4 opacity-60" />
                        </Button>''')
          # Finance card
          t = t.replace(
          '''              <Card className="rounded-2xl border-border/70 shadow-sm md:col-span-2">
                <CardHeader>
                  <CardTitle className="text-base font-semibold tracking-tight">Meu Histórico Financeiro</CardTitle>
                  <CardDescription>Dízimos registados nos últimos meses</CardDescription>
                </CardHeader>
                <CardContent className="space-y-4">''',
          '''              <Card className="overflow-hidden rounded-2xl border-0 shadow-md lg:col-span-3">
                <div className="flex flex-wrap items-center justify-between gap-2 bg-gradient-to-r from-[#0b3d91] to-[#1557c0] px-4 py-3 text-white">
                  <div className="flex items-center gap-2">
                    <TrendingUp className="h-5 w-5" />
                    <div>
                      <h2 className="text-base font-bold leading-tight">Meu Histórico Financeiro</h2>
                      <p className="text-[11px] text-blue-100">Dízimos registados nos últimos meses</p>
                    </div>
                  </div>
                  <span className="rounded-full bg-white/15 px-3 py-1 text-[11px] font-medium">Últimos 6 Meses</span>
                </div>
                <CardContent className="space-y-4 bg-white p-4 dark:bg-card">''')
          # BarChart -> AreaChart
          if 'BarChart' in t:
            t = re.sub(
              r'<ResponsiveContainer[^>]*>\s*<BarChart[\s\S]*?</BarChart>\s*</ResponsiveContainer>',
              '''<ResponsiveContainer width="100%" height="100%">
                          <AreaChart data={chartData} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                            <defs>
                              <linearGradient id="titheFill" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#1557c0" stopOpacity={0.35} />
                                <stop offset="100%" stopColor="#1557c0" stopOpacity={0.02} />
                              </linearGradient>
                            </defs>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                            <XAxis dataKey="name" tick={{ fontSize: 11 }} axisLine={false} tickLine={false} />
                            <YAxis tick={{ fontSize: 11 }} axisLine={false} tickLine={false} width={36} />
                            <Tooltip formatter={(v: any) => [formatKz(Number(v) || 0), 'Dízimo']} contentStyle={{ borderRadius: 12, border: '1px solid #e2e8f0', fontSize: 12 }} />
                            <Area type="monotone" dataKey="valor" stroke="#1557c0" strokeWidth={2.5} fill="url(#titheFill)" dot={{ r: 4, fill: '#1557c0', stroke: '#fff', strokeWidth: 2 }} />
                          </AreaChart>
                        </ResponsiveContainer>''',
              t,
              count=1,
            )
          p.write_text(t)
          print('restyled', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MemberPortal.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(portal): UI mockup Geral & Finanças (só funções existentes)" && git push; fi
