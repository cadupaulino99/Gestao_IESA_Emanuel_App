name: patch-skeleton-shimmer
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_skeleton_shimmer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/components/ui/skeleton.tsx src/App.tsx src/pages/Members.tsx src/pages/Finances.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "ui: shimmer animado nos skeletons de carregamento" && git push; fi
