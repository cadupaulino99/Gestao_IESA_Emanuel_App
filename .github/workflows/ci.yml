name: ci

# Testes + typecheck em cada pull request e em cada push para main.
# Não precisa de segredos: corre só código público.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: typecheck + testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: TypeScript ESTRITO em src/lib (v1.18)
        run: npx tsc -p tsconfig.lib.json --noEmit
      - name: Testes unitários (vitest)
        run: npx vitest run
      - name: Sintaxe do Worker
        run: node --check worker/ai-worker.js
      - name: Worker no ar vs. repo (informativo)
        continue-on-error: true
        run: |
          V_REPO="$(grep -o "WORKER_VERSION = '[^']*'" worker/ai-worker.js | head -1 | cut -d"'" -f2)"
          V_LIVE="$(curl -fsS https://iesa-ai.cadupaulino99.workers.dev/__health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version||"?")}catch{console.log("?")}})' || echo '?')"
          echo "Worker no repositório: $V_REPO | no ar: $V_LIVE"
          if [ "$V_REPO" != "$V_LIVE" ]; then
            echo "::warning::O Worker no ar ($V_LIVE) nao coincide com o repo ($V_REPO). Publique-o (docs/INICIO-RAPIDO.md). O cron diario abre issue se persistir."
          fi
