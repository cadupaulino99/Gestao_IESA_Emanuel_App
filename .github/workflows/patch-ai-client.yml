name: patch-ai-client
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch ai client
        run: python3 scripts/patch_ai_client.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai.ts
          if git diff --cached --quiet; then echo No changes; else git commit -m "security(ai): sanitizar prompts e anonimizar finanças no cliente" && git push; fi
