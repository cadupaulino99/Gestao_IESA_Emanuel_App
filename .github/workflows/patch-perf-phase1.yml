name: patch-perf-phase1
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_perf_phase1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx vite.config.ts src/components/ui/skeleton.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "perf: React Query, code-split, Dashboard lazy, skeleton" && git push; fi
