name: patch-search-debounce
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_search_debounce.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useDebouncedValue.ts src/pages/Members.tsx src/pages/Finances.tsx src/pages/Contributions.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "perf: debounce 300ms na pesquisa (membros, finanças, contribuições)" && git push; fi
