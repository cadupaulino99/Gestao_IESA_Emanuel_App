name: patch-delete-admin
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_delete_admin.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/ai-worker.js src/lib/ai.ts src/pages/Admin.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(admin): super admin pode apagar administradores" && git push; fi
