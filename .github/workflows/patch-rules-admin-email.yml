name: patch-rules-admin-email
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_rules_admin_email_lower.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(rules): authEmail() minúsculas nos paths admins/" && git push; fi
