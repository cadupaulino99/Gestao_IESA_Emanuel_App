name: bump-1-21-27
on:
  workflow_dispatch: {}
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bump_1_21_27.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then echo No changes; else git commit -m "chore: versão 1.21.27" && git push; fi
