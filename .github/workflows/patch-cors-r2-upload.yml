name: patch-cors-r2-upload
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_cors_r2_upload.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/ai-worker.js src/lib/posters.ts
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(r2): CORS e upload sem cabeçalho custom" && git push; fi
