name: patch-roles-implementation
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_roles_implementation.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/roles.ts src/lib/access.ts src/components/Layout.tsx src/pages/Admin.tsx firestore.rules worker/ai-worker.js
          if git diff --cached --quiet; then echo No changes; else git commit -m "feat(roles): matriz de papéis IESA na UI e regras" && git push; fi
