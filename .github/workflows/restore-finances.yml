name: restore-finances
on:
  workflow_dispatch: {}
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Finances from stable commit and modernize UI
        run: |
          set -euo pipefail
          curl -sS -L "https://raw.githubusercontent.com/cadupaulino99/Gestao_IESA_Emanuel_App/dcf10f01e384d5174146a1bbba3810202e808e0e/src/pages/Finances.tsx" -o src/pages/Finances.tsx
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/Finances.tsx')
          t = p.read_text()
          t = t.replace(
              "import { Plus, Trash2, Info, Download, Pencil, FileText, Check, ChevronsUpDown, Printer, MessageCircle, AlertTriangle, Loader2 } from 'lucide-react';",
              "import { Plus, Trash2, Info, Download, Pencil, FileText, Check, ChevronsUpDown, Printer, MessageCircle, AlertTriangle, Loader2, Wallet } from 'lucide-react';",
              1,
          )
          old = '''  return (\n    <div className="space-y-6">\n      <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">\n        <div>\n          <h2 className="text-3xl font-bold tracking-tight">Gestão Mensal</h2>\n          <p className="text-muted-foreground">Registo de entradas e saídas.</p>\n        </div>\n        <div className="flex flex-wrap items-center gap-2">'''
          new = '''  return (\n    <div className="mx-auto w-full max-w-6xl space-y-5 pb-6">\n      <header className="relative overflow-hidden rounded-2xl border bg-card px-4 py-5 shadow-sm sm:px-6 sm:py-6">\n        <div className="pointer-events-none absolute -right-14 -top-16 h-52 w-52 rounded-full bg-emerald-500/10 blur-3xl" />\n        <div className="relative flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">\n          <div className="max-w-xl">\n            <div className="mb-2 inline-flex items-center gap-2 rounded-full border bg-background/80 px-3 py-1 text-xs font-medium text-muted-foreground">\n              <Wallet className="h-3.5 w-3.5 text-emerald-600" />\n              TESOURARIA\n            </div>\n            <h2 className="text-2xl font-bold tracking-tight sm:text-3xl">Gestão Mensal</h2>\n            <p className="mt-1 text-sm text-muted-foreground sm:text-base">\n              Registo de entradas, ofertas e saídas · {selectedMonth} {selectedYear}\n            </p>\n          </div>\n          <div className="flex flex-wrap items-center gap-2">'''
          if old not in t:
              raise SystemExit('header start not found')
          t = t.replace(old, new, 1)
          old_tabs = '''        </div>\n      </div>\n\n        <Tabs defaultValue="estatisticas" className="w-full">\n          <TabsList className="grid w-full grid-cols-4 md:w-[500px]">\n            <TabsTrigger value="estatisticas">Análise</TabsTrigger>\n            <TabsTrigger value="dizimos">Membros</TabsTrigger>\n            <TabsTrigger value="ofertas">Ofertas</TabsTrigger>\n            <TabsTrigger value="saidas">Saídas</TabsTrigger>\n          </TabsList>'''
          new_tabs = '''        </div>\n        </div>\n      </header>\n\n        <Tabs defaultValue="estatisticas" className="w-full">\n          <TabsList className="flex h-auto w-full flex-wrap gap-1 rounded-xl border bg-white p-1 shadow-sm dark:bg-card md:w-auto">\n            <TabsTrigger value="estatisticas" className="rounded-lg text-xs sm:text-sm">Análise</TabsTrigger>\n            <TabsTrigger value="dizimos" className="rounded-lg text-xs sm:text-sm">Membros</TabsTrigger>\n            <TabsTrigger value="ofertas" className="rounded-lg text-xs sm:text-sm">Ofertas</TabsTrigger>\n            <TabsTrigger value="saidas" className="rounded-lg text-xs sm:text-sm">Saídas</TabsTrigger>\n          </TabsList>'''
          if old_tabs not in t:
              raise SystemExit('tabs block not found')
          t = t.replace(old_tabs, new_tabs, 1)
          t = t.replace(
              '''          <TabsContent value="dizimos" className="mt-4">\n            <Card>\n              <CardHeader className="flex flex-col md:flex-row md:items-center justify-between gap-4">\n                <div>\n                  <CardTitle>Entradas de Membros - {selectedMonth}</CardTitle>''',
              '''          <TabsContent value="dizimos" className="mt-4">\n            <Card className="rounded-2xl border-border/70 shadow-sm">\n              <CardHeader className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">\n                <div>\n                  <CardTitle className="text-base font-semibold tracking-tight">Entradas de Membros · {selectedMonth}</CardTitle>''',
              1,
          )
          t, n2 = re.subn(
              r'(<TabsContent value="ofertas" className="mt-4">\s*)<Card>\s*<CardHeader className="flex flex-col md:flex-row md:items-center justify-between gap-4">\s*<div>\s*<CardTitle>Ofertas de \{selectedMonth\}</CardTitle>',
              r'\1<Card className="rounded-2xl border-border/70 shadow-sm">\n              <CardHeader className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">\n                <div>\n                 <CardTitle className="text-base font-semibold tracking-tight">Ofertas · {selectedMonth}</CardTitle>',
              t, count=1)
          t, n3 = re.subn(
              r'(<TabsContent value="saidas" className="mt-4">\s*)<Card>\s*<CardHeader className="flex flex-col md:flex-row md:items-center justify-between gap-4">\s*<div>\s*<CardTitle>Saídas de \{selectedMonth\}</CardTitle>',
              r'\1<Card className="rounded-2xl border-border/70 shadow-sm">\n              <CardHeader className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">\n                <div>\n                  <CardTitle className="text-base font-semibold tracking-tight">Saídas · {selectedMonth}</CardTitle>',
              t, count=1)
          if 'TESOURARIA' not in t or 'handleAddTithe' not in t:
              raise SystemExit('validation failed')
          print('ofertas', n2, 'saidas', n3)
          p.write_text(t)
          print('ok', len(t))
          PY
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finances.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix+ui(financas): restaurar gestão mensal e modernizar cabeçalho"
            git push
          fi
