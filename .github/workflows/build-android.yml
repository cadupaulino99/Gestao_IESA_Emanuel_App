name: Build Android (APK + AAB)

# Necessario para o passo "Release no GitHub" conseguir criar tags/anexar ficheiros
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'apk/**'
      - '**.md'
  workflow_dispatch: {}

jobs:
  build-android:
    name: Compilar APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Versao da app (ver docs/GUIA-BUILD-APK.md):
      #   Settings > Secrets and variables > Actions > Variables (do REPOSITORIO)
      #   VERSION_NAME = 1.4.0     VERSION_CODE = 4
      # Se nao estiverem definidas, caem no version do package.json e no run_number.
      VERSION_NAME_VAR: ${{ vars.VERSION_NAME }}
      VERSION_CODE_VAR: ${{ vars.VERSION_CODE }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Resolver versao (ANDROID_VERSION_NAME / ANDROID_VERSION_CODE)
        run: |
          # Sanitiza: remove espacos/CR/LF que venham colados nas variables do repo
          NAME="$(printf '%s' "$VERSION_NAME_VAR" | tr -d '[:space:]')"
          CODE="$(printf '%s' "$VERSION_CODE_VAR" | tr -d '[:space:]')"
          case "$CODE" in ''|*[!0-9]*) CODE="" ;; esac
          if [ -z "$NAME" ]; then
            NAME="$(node -p "require('./package.json').version")"
          fi
          if [ -z "$CODE" ]; then
            CODE="$RUN_NUMBER"
          fi
          printf 'ANDROID_VERSION_NAME=%s\n' "$NAME" >> "$GITHUB_ENV"
          printf 'ANDROID_VERSION_CODE=%s\n' "$CODE" >> "$GITHUB_ENV"
          printf 'Versao deste build: %s (%s)\n' "$NAME" "$CODE"

      - name: Instalar dependências web
        run: npm ci

      - name: google-services.json (se existir nos secrets)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json aplicado."
          else
            echo "Sem secret GOOGLE_SERVICES_JSON — o APK compila, mas o login Google nativo ficara inativo."
          fi

      - name: Keystore de release (se existir nos secrets)
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            base64 -d <<< "$KEYSTORE_B64" > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/app/keystore.properties
            echo "Keystore aplicado — release sera assinado."
          else
            echo "Sem keystore — release assinado com chave de debug (so para testes)."
          fi

      - name: Build web + sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK (debug) e AAB/APK (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease bundleRelease

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: gestao-iesa-android-v${{ env.ANDROID_VERSION_NAME }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Release no GitHub (link publico de download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=android/app/build/outputs/apk/debug/app-debug.apk
          R=android/app/build/outputs/apk/release/app-release.apk
          TAG="v$ANDROID_VERSION_NAME"
          LD="Gestao-IESA-Emanuel-$TAG-debug.apk"
          LR="Gestao-IESA-Emanuel-$TAG-release.apk"
          [ -f "$D" ] || { echo "::error::APK debug nao encontrado"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ja existe — substituo os ficheiros."
            gh release upload "$TAG" "$D#$LD" "$R#$LR" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Gestao IESA Emanuel $TAG" \
              --notes "APK para instalacao direta no telemovel (debug e release). Build $GITHUB_RUN_NUMBER." \
              "$D#$LD" "$R#$LR"
          fi
          echo ""
          echo "LINK PUBLICO DE DOWNLOAD (sem login):"
          echo "  https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "  direto: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$LD"
