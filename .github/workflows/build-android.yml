name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'apk/**'
      - '**.md'
  workflow_dispatch: {}

jobs:
  build-android:
    name: Compilar APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependências web
        run: npm ci

      - name: google-services.json (se existir nos secrets)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json aplicado."
          else
            echo "Sem secret GOOGLE_SERVICES_JSON — o APK compila, mas o login Google nativo ficara inativo."
          fi

      - name: Keystore de release (se existir nos secrets)
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            base64 -d <<< "$KEYSTORE_B64" > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/app/keystore.properties
            echo "Keystore aplicado — release sera assinado."
          else
            echo "Sem keystore — release assinado com chave de debug (so para testes)."
          fi

      - name: Build web + sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK (debug) e AAB/APK (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease bundleRelease

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: gestao-iesa-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
