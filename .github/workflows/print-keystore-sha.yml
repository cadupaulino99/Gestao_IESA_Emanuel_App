name: print-keystore-sha

# Mostra SHA-1 / SHA-256 do keystore de release (secrets KEYSTORE_*)
# para colar no Firebase e na Android key da Google Cloud.
# Não imprime a chave privada nem a password.

on:
  workflow_dispatch: {}

jobs:
  sha:
    name: Imprimir SHA do keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descodificar keystore e listar impressões
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          KB="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          SP="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          KA="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"

          if [ -z "$KB" ]; then
            echo "::error::Secret KEYSTORE_B64 em falta. Sem keystore de release no GitHub."
            echo "Alternativa: use o SHA-1 do debug no seu PC:"
            echo "  keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android"
            exit 1
          fi
          if [ -z "$SP" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD em falta."
            exit 1
          fi

          echo "$KB" | base64 -d > /tmp/release.keystore

          echo "========== keytool -list (todos os aliases) =========="
          keytool -list -v -keystore /tmp/release.keystore -storepass "$SP" || true

          if [ -n "$KA" ]; then
            echo ""
            echo "========== Alias: $KA =========="
            keytool -list -v -keystore /tmp/release.keystore -alias "$KA" -storepass "$SP" || true
          fi

          echo ""
          echo "Copie a linha SHA1: (ou SHA-1) e cole:"
          echo "  1) Firebase → Definições do projecto → App Android → + Adicionar impressão digital"
          echo "  2) Google Cloud → Credenciais → Android key → Apps Android → pacote + SHA-1"
          echo "Pacote: ao.co.iesa.emanuelxangongo.gestao"

          rm -f /tmp/release.keystore
