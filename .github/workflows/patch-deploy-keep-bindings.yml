name: patch-deploy-keep-bindings
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_deploy_keep_bindings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/deploy-worker-api.mjs
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(deploy): keep_bindings para secrets do Worker" && git push; fi
