name: fix-member-access
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_member_access.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/App.tsx src/components/admin/PendingSignups.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix: acesso de novos membros (email + ecrã aprovado)" && git push; fi
