name: restore-portal-curl
on:
  workflow_dispatch: {}
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download good version
        run: |
          curl -fsSL "https://raw.githubusercontent.com/cadupaulino99/Gestao_IESA_Emanuel_App/3ae471d76ac05db78ebdbd3d97ede1c69642541a/src/pages/MemberPortal.tsx" -o src/pages/MemberPortal.tsx
          head -3 src/pages/MemberPortal.tsx
          wc -c src/pages/MemberPortal.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MemberPortal.tsx
          git commit -m "fix: restaurar MemberPortal.tsx (remover PLACEHOLDER)"
          git push
