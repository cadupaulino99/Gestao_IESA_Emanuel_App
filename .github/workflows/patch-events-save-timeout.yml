name: patch-events-save-timeout
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_events_save_timeout.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/EventsAdmin.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(events): gravação sem bloqueio em notificações/Storage" && git push; fi
