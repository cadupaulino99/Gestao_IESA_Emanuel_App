name: patch-mural-bugs
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_mural_bugs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules src/lib/posters.ts src/components/admin/EventsAdmin.tsx src/components/board/BoardEngagementBar.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(mural): likes/comentários e cartaz de eventos" && git push; fi
