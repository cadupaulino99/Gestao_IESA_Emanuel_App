name: restore-radio
on:
  workflow_dispatch: {}
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Modernize Radio UI
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/pages/Radio.tsx')
          t = p.read_text()
          if 'Rádio em direto' in t and 'max-w-3xl' in t:
              print('already modernized')
              raise SystemExit(0)
          old_root = '''  return (\n    <div className="space-y-3 md:space-y-4 pb-4">\n      <div className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-rose-950 text-white shadow-xl shadow-rose-900/10">\n        <div className="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full bg-rose-500/20 blur-3xl" />\n        <div className="relative p-3.5 sm:p-4">\n          <div className="mb-3 flex items-center justify-between gap-2">\n            <div className="flex min-w-0 items-center gap-2.5">\n              <div className="relative flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-rose-500 via-red-500 to-orange-400 shadow-lg">'''
          new_root = '''  return (\n    <div className="mx-auto w-full max-w-3xl space-y-4 pb-6">\n      <div className="relative overflow-hidden rounded-2xl border border-white/5 bg-gradient-to-br from-slate-900 via-slate-900 to-rose-950 text-white shadow-xl shadow-rose-900/10">\n        <div className="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full bg-rose-500/20 blur-3xl" />\n        <div className="relative p-4 sm:p-5">\n          <div className="mb-1 inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/5 px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-[0.14em] text-rose-100/90">\n            <RadioIcon className="h-3 w-3" />\n            Rádio em direto\n          </div>\n          <div className="mb-3 flex items-center justify-between gap-2">\n            <div className="flex min-w-0 items-center gap-2.5">\n              <div className="relative flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-rose-500 via-red-500 to-orange-400 shadow-lg">'''
          if old_root not in t:
              raise SystemExit('root block not found')
          t = t.replace(old_root, new_root, 1)
          t = t.replace(
              '<h1 className="truncate text-sm font-semibold sm:text-base">{RADIO.name}</h1>',
              '<h1 className="truncate text-base font-semibold tracking-tight sm:text-lg">{RADIO.name}</h1>',
              1,
          )
          t = t.replace(
              '''              <CardTitle className="flex items-center gap-2 text-sm"><Mic className={`h-4 w-4 ${recorder.recording ? 'animate-pulse text-red-500' : 'text-slate-400'}`} />Gravar</CardTitle>''',
              '''              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Mic className={`h-4 w-4 ${recorder.recording ? 'animate-pulse text-red-500' : 'text-slate-400'}`} />Gravar</CardTitle>''',
              1,
          )
          t = t.replace(
              '''              <CardTitle className="flex items-center gap-2 text-sm"><Music4 className="h-4 w-4 text-slate-400" />Gravações</CardTitle>''',
              '''              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Music4 className="h-4 w-4 text-slate-400" />Gravações</CardTitle>''',
              1,
          )
          t = t.replace(
              '''          <Card>\n            <CardHeader className="pb-2">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Mic''',
              '''          <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n            <CardHeader className="border-b bg-muted/20 pb-3">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Mic''',
              1,
          )
          # If first replace on Mic card header title only ran, still upgrade Card wrapper
          t = t.replace(
              '''          <Card>\n            <CardHeader className="pb-2">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Mic''',
              '''          <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n            <CardHeader className="border-b bg-muted/20 pb-3">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Mic''',
              1,
          )
          t = t.replace(
              '''          <Card>\n            <CardHeader className="pb-2">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Music4''',
              '''          <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n            <CardHeader className="border-b bg-muted/20 pb-3">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Music4''',
              1,
          )
          # Also handle original Music4 title without font-semibold yet
          t = t.replace(
              '''          <Card>\n            <CardHeader className="pb-2">\n              <CardTitle className="flex items-center gap-2 text-sm"><Music4 className="h-4 w-4 text-slate-400" />Gravações</CardTitle>''',
              '''          <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n            <CardHeader className="border-b bg-muted/20 pb-3">\n              <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><Music4 className="h-4 w-4 text-slate-400" />Gravações</CardTitle>''',
              1,
          )
          t = t.replace(
              '''        <Card>\n          <CardHeader className="pb-2">\n            <CardTitle className="flex items-center gap-2 text-sm"><RadioIcon className="h-4 w-4" />Gravações da igreja</CardTitle>\n          </CardHeader>\n          <CardContent className="space-y-2">\n            {published.length === 0 ? (\n              <p className="py-3 text-center text-xs text-muted-foreground">Ainda não há gravações publicadas.</p>\n            ) : published.map((p) => (\n              <div key={p.id} className="space-y-1.5 rounded-lg border p-2.5">''',
              '''        <Card className="overflow-hidden rounded-2xl border-border/70 shadow-sm">\n          <CardHeader className="border-b bg-muted/20 pb-3">\n            <CardTitle className="flex items-center gap-2 text-sm font-semibold tracking-tight"><RadioIcon className="h-4 w-4" />Gravações da igreja</CardTitle>\n          </CardHeader>\n          <CardContent className="space-y-2 pt-3">\n            {published.length === 0 ? (\n              <p className="py-3 text-center text-xs text-muted-foreground">Ainda não há gravações publicadas.</p>\n            ) : published.map((p) => (\n              <div key={p.id} className="space-y-1.5 rounded-xl border bg-card p-3 shadow-sm">''',
              1,
          )
          if 'Rádio em direto' not in t or 'toggleLive' not in t:
              raise SystemExit('validation failed')
          p.write_text(t)
          print('ok', len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Radio.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "ui(radio): modernizar player e cartões de gravação" && git push; fi
