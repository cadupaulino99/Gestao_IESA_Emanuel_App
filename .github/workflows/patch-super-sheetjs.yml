name: patch-super-sheetjs
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_super_sheetjs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules src/pages/Admin.tsx docs/DEPENDENCIAS-EXTERNAS.md
          if git diff --cached --quiet; then echo No changes; else git commit -m "security: endurecer bootstrap superadmin; documentar SheetJS" && git push; fi
