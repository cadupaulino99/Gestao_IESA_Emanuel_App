name: patch-finances-dash
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/patch_finances_dashboard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finances.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "ui(financas): dashboard compacto com KPIs e atalhos funcionais" && git push; fi
