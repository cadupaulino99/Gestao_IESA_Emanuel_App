name: patch-poster-robust
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_poster_robust.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/posters.ts src/components/admin/EventsAdmin.tsx worker/ai-worker.js
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(posters): upload R2 mais robusto + fallback de gravação" && git push; fi
