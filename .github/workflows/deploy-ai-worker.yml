name: deploy-ai-worker

# Publica o Cloudflare Worker "iesa-ai" automaticamente sempre que o código do
# Worker muda. ISTO É O QUE FALTAVA: antes o Worker só era atualizado colando o
# código à mão no editor da Cloudflare, por isso as rotas novas
# (/assistant/extract-member e /assistant/extract-receipt — leitura do BI)
# nunca chegavam ao servidor e a app recebia 404 "Rota nao encontrada".
#
# Configuração obrigatória (uma vez):
#   1. Cloudflare → My Profile → API Tokens → Create Token
#      → Account / Workers Scripts / Edit → copiar o token
#   2. GitHub → repositório → Settings → Secrets and variables → Actions
#      → New repository secret:
#         CLOUDFLARE_API_TOKEN  = <token>
#         CLOUDFLARE_ACCOUNT_ID = <id da conta>
#
# ⚠️ O `wrangler deploy` APAGA os segredos do Worker que não estiverem no
#    wrangler.toml. Este job fotografa os segredos antes e depois e FALHA se
#    algum desaparecer, em vez de deixar o Worker sem chaves em silêncio.
#
# Verificação após o deploy:
#   https://iesa-ai.cadupaulino99.workers.dev/__health
#   → "version": "2.0.0" (ou superior), "vision": true

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ai-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Publicar Worker iesa-ai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe do Worker
        run: node --check worker/ai-worker.js

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fotografar segredos ANTES do deploy
        run: |
          npx --yes wrangler@latest secret list \
            --config worker/wrangler.toml \
            --api-token "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --account-id "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            > /tmp/secrets-before.txt 2>/dev/null || true
          echo '--- segredos antes ---'
          cat /tmp/secrets-before.txt

      - name: Publicar na Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml

      - name: Confirmar versão no ar
        run: |
          sleep 10
          echo '--- /__health ---'
          curl -fsS https://iesa-ai.cadupaulino99.workers.dev/__health > /tmp/health.json || true
          cat /tmp/health.json; echo
          if ! grep -q '"version"' /tmp/health.json; then
            echo '::error::O Worker no ar nao devolve /__health — o deploy falhou?'
            exit 1
          fi

      - name: Confirmar que os segredos sobreviveram
        run: |
          npx --yes wrangler@latest secret list \
            --config worker/wrangler.toml \
            --api-token "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --account-id "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            > /tmp/secrets-after.txt 2>/dev/null || true
          echo '--- segredos depois ---'
          cat /tmp/secrets-after.txt
          for S in GEMINI_API_KEY FIREBASE_SA_JSON; do
            if grep -q "$S" /tmp/secrets-before.txt && ! grep -q "$S" /tmp/secrets-after.txt; then
              echo "::error::O segredo $S foi APAGADO pelo deploy. Reponha-o imediatamente:"
              echo "    npx wrangler secret put $S --config worker/wrangler.toml"
              echo "  (ou no painel: Workers → iesa-ai → Settings → Variables and Secrets)"
              exit 1
            fi
          done
          echo 'Worker publicado e segredos intactos.'
