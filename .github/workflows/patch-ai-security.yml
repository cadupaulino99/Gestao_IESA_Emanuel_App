name: patch-ai-security
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply AI security patch
        run: python3 scripts/patch_ai_sec.py
      - name: Syntax check
        run: node --check worker/ai-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/ai-worker.js
          if git diff --cached --quiet; then echo No changes; else git commit -m "security(ai): auth, rate limit visao e auditoria (worker 2.11.0)" && git push; fi
