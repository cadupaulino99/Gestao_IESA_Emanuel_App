name: fix-admin-password
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_admin_password_rules.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules src/components/admin/ForcePasswordChangeModal.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix: troca de senha admin (reauth + regras email)" && git push; fi
