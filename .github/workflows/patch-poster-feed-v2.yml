name: patch-poster-feed-v2
on:
  workflow_dispatch: {}
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_poster_feed_v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/board.ts src/components/board/EventFeedPost.tsx src/components/portal/MemberBoard.tsx
          if git diff --cached --quiet; then echo No changes; else git commit -m "fix(portal): cartazes no feed + UI Avisos & Eventos" && git push; fi
